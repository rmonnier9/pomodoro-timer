<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#241816">
  <meta name="description" content="Timer Pomodoro : 25 minutes de travail, 5 minutes de pause.">
  <title>Pomodoro version 2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23e85d4c'/%3E%3Ccircle cx='16' cy='17' r='7' fill='none' stroke='%23fff7f2' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #241816;
      --glow: rgba(232, 93, 76, 0.42);
      --accent: #e85d4c;
      --ink: #f6efe9;
      --muted: #cbb8ae;
      --line: rgba(246, 239, 233, 0.16);
      --on-accent: #2a1210;
      color-scheme: dark;
    }

    body[data-mode="break"] {
      --bg: #17211c;
      --glow: rgba(143, 181, 131, 0.4);
      --accent: #8fb583;
      --ink: #f3f6f1;
      --muted: #b7c4b4;
      --line: rgba(243, 246, 241, 0.16);
      --on-accent: #142016;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));
      background:
        radial-gradient(900px 520px at 50% 0%, var(--glow), transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    main {
      width: min(420px, 100%);
      text-align: center;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .mark svg { display: block; }

    .dial {
      position: relative;
      width: min(340px, 88vw);
      margin: 28px auto 8px;
    }

    svg.ring {
      display: block;
      width: 100%;
      height: auto;
      transform: rotate(-90deg);
    }

    .track {
      fill: none;
      stroke: var(--line);
      stroke-width: 8;
    }

    .progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
    }

    .face {
      position: absolute;
      inset: 18%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .mode {
      margin: 0;
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .time {
      margin: 6px 0 0;
      font-size: clamp(4.2rem, 16vw, 5.4rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    .sub {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    button {
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.8rem 1.25rem;
      min-height: 48px;
      cursor: pointer;
    }

    button:hover { border-color: var(--muted); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    #toggle {
      background: var(--accent);
      color: var(--on-accent);
      border-color: transparent;
      min-width: 9.5rem;
      font-weight: 600;
    }

    #toggle:hover { filter: brightness(1.06); }

    .meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 26px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .text-btn {
      border: 0;
      background: none;
      color: var(--muted);
      min-height: 0;
      padding: 0.2rem 0.1rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      border-radius: 0;
    }

    .hint {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      opacity: 0.85;
    }

    @media (max-width: 640px) {
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      body { transition: none; }
    }
  </style>
</head>
<body data-mode="work" data-running="false">
  <main>
    <p class="mark">
      <svg width="14" height="14" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="currentColor"></circle>
      </svg>
      Pomodoro
    </p>

    <div class="dial">
      <svg class="ring" viewBox="0 0 280 280" aria-hidden="true">
        <circle class="track" cx="140" cy="140" r="120"></circle>
        <circle class="progress" id="progress" cx="140" cy="140" r="120"></circle>
      </svg>
      <div class="face">
        <p class="mode" id="mode">Travail</p>
        <p class="time" id="time" aria-live="polite">25:00</p>
        <p class="sub" id="sub">25 minutes</p>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="toggle">Démarrer</button>
      <button type="button" id="reset">Réinitialiser</button>
      <button type="button" id="skip">Passer</button>
    </div>

    <div class="meta">
      <span id="sessions">Aucune session terminée</span>
      <button type="button" class="text-btn" id="mute" aria-pressed="false">Son</button>
    </div>

    <p class="hint">Espace : démarrer ou suspendre · R : réinitialiser</p>
  </main>

  <script>
    (() => {
      const WORK = 25 * 60;
      const BREAK = 5 * 60;
      const RADIUS = 120;
      const CIRC = 2 * Math.PI * RADIUS;
      const KEY = "pomodoro-timer";

      const body = document.body;
      const progress = document.getElementById("progress");
      const modeEl = document.getElementById("mode");
      const timeEl = document.getElementById("time");
      const subEl = document.getElementById("sub");
      const sessionsEl = document.getElementById("sessions");
      const toggleBtn = document.getElementById("toggle");
      const resetBtn = document.getElementById("reset");
      const skipBtn = document.getElementById("skip");
      const muteBtn = document.getElementById("mute");
      const theme = document.querySelector('meta[name="theme-color"]');

      progress.style.strokeDasharray = String(CIRC);

      let mode = "work";
      let remaining = WORK;
      let running = false;
      let endAt = null;
      let completed = 0;
      let muted = false;
      let raf = 0;
      let audioCtx = null;

      function duration(next) {
        return (next || mode) === "work" ? WORK : BREAK;
      }

      function format(total) {
        const safe = Math.max(0, total);
        const m = Math.floor(safe / 60);
        const s = safe % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function fraction() {
        const total = duration();
        const left = running && endAt != null
          ? Math.max(0, (endAt - Date.now()) / 1000)
          : remaining;
        return Math.min(1, Math.max(0, left / total));
      }

      function paint() {
        const label = mode === "work" ? "Travail" : "Pause";
        const clock = format(running && endAt != null
          ? Math.max(0, Math.ceil((endAt - Date.now()) / 1000))
          : remaining);

        body.dataset.mode = mode;
        body.dataset.running = String(running);
        theme.setAttribute("content", mode === "work" ? "#241816" : "#17211c");
        modeEl.textContent = label;
        timeEl.textContent = clock;
        subEl.textContent = mode === "work" ? "25 minutes" : "5 minutes";
        progress.style.strokeDashoffset = String(CIRC * (1 - fraction()));
        document.title = clock + " · " + label;

        if (completed === 0) sessionsEl.textContent = "Aucune session terminée";
        else if (completed === 1) sessionsEl.textContent = "1 session terminée";
        else sessionsEl.textContent = completed + " sessions terminées";

        toggleBtn.textContent = running
          ? "Suspendre"
          : (remaining === duration() ? "Démarrer" : "Reprendre");

        muteBtn.textContent = muted ? "Muet" : "Son";
        muteBtn.setAttribute("aria-pressed", String(muted));
      }

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify({
            mode, remaining, running, endAt, completed, muted
          }));
        } catch (_) {}
      }

      function load() {
        try {
          const raw = localStorage.getItem(KEY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (data.mode === "work" || data.mode === "break") mode = data.mode;
          if (Number.isFinite(data.completed) && data.completed >= 0) {
            completed = Math.floor(data.completed);
          }
          muted = Boolean(data.muted);
          const total = duration();
          if (Number.isFinite(data.remaining)) {
            remaining = Math.min(total, Math.max(0, Math.round(data.remaining)));
          } else {
            remaining = total;
          }
          if (data.running && Number.isFinite(data.endAt)) {
            running = true;
            endAt = data.endAt;
            catchUp(false);
          }
        } catch (_) {}
      }

      function ensureAudio() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function chime() {
        if (muted) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          const start = now + i * 0.14;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.12, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.5);
        });
      }

      function notify(text) {
        if (!("Notification" in window) || Notification.permission !== "granted") return;
        try {
          new Notification("Pomodoro", { body: text });
        } catch (_) {}
      }

      function advance(opts) {
        const finishedWork = mode === "work" && !opts.skipped;
        if (finishedWork) completed += 1;
        mode = mode === "work" ? "break" : "work";
        remaining = duration();
        if (opts.keepRunning) {
          const base = opts.fromNow || endAt == null ? Date.now() : endAt;
          endAt = base + remaining * 1000;
          running = true;
        } else {
          running = false;
          endAt = null;
        }
        if (opts.notify) {
          chime();
          notify(mode === "break"
            ? "Session terminée. Pause de 5 minutes."
            : "Pause terminée. Au travail.");
        }
      }

      function catchUp(shouldNotify) {
        let guard = 0;
        let notified = false;
        while (running && endAt != null && Date.now() >= endAt && guard < 64) {
          advance({
            notify: shouldNotify && !notified,
            keepRunning: true,
            skipped: false,
            fromNow: false
          });
          notified = true;
          guard += 1;
        }
      }

      function frame() {
        if (!running) return;
        if (endAt != null && Date.now() >= endAt) {
          catchUp(true);
          save();
        } else if (endAt != null) {
          remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
        }
        paint();
        raf = requestAnimationFrame(frame);
      }

      function start() {
        if (running) return;
        if (remaining <= 0) remaining = duration();
        running = true;
        endAt = Date.now() + remaining * 1000;
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
        ensureAudio();
        save();
        paint();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }

      function pause() {
        if (!running) return;
        if (endAt != null) {
          remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
        }
        running = false;
        endAt = null;
        cancelAnimationFrame(raf);
        save();
        paint();
      }

      function reset() {
        running = false;
        endAt = null;
        remaining = duration();
        cancelAnimationFrame(raf);
        save();
        paint();
      }

      function skip() {
        const wasRunning = running;
        advance({
          notify: false,
          keepRunning: wasRunning,
          skipped: true,
          fromNow: true
        });
        save();
        paint();
        if (running) {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        }
      }

      toggleBtn.addEventListener("click", () => (running ? pause() : start()));
      resetBtn.addEventListener("click", reset);
      skipBtn.addEventListener("click", skip);
      muteBtn.addEventListener("click", () => {
        muted = !muted;
        if (!muted) ensureAudio();
        save();
        paint();
      });

      document.addEventListener("keydown", (event) => {
        if (event.target.closest("button")) return;
        if (event.code === "Space") {
          event.preventDefault();
          running ? pause() : start();
        } else if (event.key === "r" || event.key === "R") {
          reset();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && running) catchUp(true);
        paint();
      });

      load();
      paint();
      if (running) raf = requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
